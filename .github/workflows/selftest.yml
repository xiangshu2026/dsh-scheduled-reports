name: selftest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run selftest
        run: node test/selftest.mjs
